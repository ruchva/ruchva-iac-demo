---
- name: Crear el directorio de despliegue
  ansible.builtin.file:
    path: /opt/facturacion
    state: directory
    mode: "0755"

- name: Renderizar docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/facturacion/docker-compose.yml
    mode: "0644"

- name: Levantar el stack con Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/facturacion
  changed_when: true

- name: Esperar a que LocalStack esté disponible
  ansible.builtin.uri:
    url: "http://localhost:{{ localstack_port }}/_localstack/health"
    status_code: 200
  register: localstack_health
  until: localstack_health.status == 200
  retries: 20
  delay: 3

- name: Crear la cola de SQS ({{ sqs_queue_name }}) en LocalStack
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T localstack
      awslocal sqs create-queue --queue-name {{ sqs_queue_name }}
    chdir: /opt/facturacion
  register: queue_create
  changed_when: "'QueueUrl' in queue_create.stdout"
  failed_when: >-
    queue_create.rc != 0 and 'QueueAlreadyExists' not in queue_create.stderr
